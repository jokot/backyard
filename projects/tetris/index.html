<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="layout">
    <canvas id="game" width="480" height="640"></canvas>
    <div id="help">
      <h2>Controls</h2>
      <ul>
        <li><b>&larr;</b> / <b>&rarr;</b> move</li>
        <li><b>&uarr;</b> rotate</li>
        <li><b>&darr;</b> soft drop</li>
        <li><b>Space</b> start / hard drop / restart</li>
        <li><b>P</b> pause / resume</li>
      </ul>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
