<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #e2e8f0;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  h1 { font-size: 26px; letter-spacing: 3px; color: #38bdf8; margin-bottom: 4px; }
  .sub { color: #64748b; font-size: 13px; margin-bottom: 14px; }

  table { border-collapse: collapse; margin-top: 6px; }
  td {
    width: 46px; height: 46px; text-align: center; font-size: 24px;
    border: 1px solid #475569; cursor: pointer; user-select: none;
  }
  td.br  { border-right: 2px solid #334155; }
  td.bb  { border-bottom: 2px solid #334155; }
  td.cell { border-radius: 4px; }

  td.cell.given { color: #94a3b8; }
  td.cell.user  { color: #e2e8f0; font-weight: 700; }
  td.cell.selected { background: #38bdf8; color: #0f172a; box-shadow: inset 0 0 0 2px #38bdf8; }
  td.cell.same    { background: #475569; }
  td.cell.rowcol  { background: rgba(56, 189, 248, 0.12); }
  td.cell.error   { color: #f87171; text-shadow: 0 0 4px #f87171; font-weight: 700; }
  td.cell.locked  { cursor: default; }

  .pencil { font-size: 12px; line-height: 1; display: flex; flex-wrap: wrap; margin-top: 6px; }
  .pencil span { width: 13px; text-align: center; }

  select, button { background: #334155; color: #e2e8f0; border: none; padding: 9px 15px;
                   border-radius: 8px; font-size: 14px; cursor: pointer; }
  button:hover { background: #475569; }
  button.primary { background: #0e7490; color: #fff; }
  button.primary:hover { background: #155e75; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
  .hud { margin-top: 14px; color: #94a3b8; font-size: 15px; min-height: 20px; font-weight: 600; }
  .auto-bar { display: flex; gap: 14px; margin-top: 8px; font-size: 14px; color: #cbd5e1; align-items: center; }
  .auto-bar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .auto-bar input { accent-color: #38bdf8; width: 16px; height: 16px; }
  .num-pad { display: flex; gap: 6px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .num-pad button { width: 42px; height: 42px; font-size: 17px; }
  .num-pad button.off { opacity: .55; }
  .footer { margin-top: 12px; color: #475569; font-size: 12px; line-height: 1.5; text-align: center; }
</style>
</head>
<body>
  <h1>SUDOKU</h1>
  <div class="sub">Select a cell &amp; type a number — or use the number pad</div>

  <table id="grid"></table>

  <div class="auto-bar">
    <label><input type="checkbox" id="noteMode" checked> Pencil (notes)</label>
    <label><input type="checkbox" id="errCheck" checked> Show errors</label>
  </div>

  <div class="num-pad" id="numPad"></div>

  <div class="controls">
    <button class="primary" id="newBtn">New game</button>
    <select id="diff">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="hintBtn">Hint</button>
    <button id="undoBtn">Undo</button>
    <button id="clearBtn">Clear</button>
    <button id="checkBtn">Check</button>
    <button id="solveBtn">Solve</button>
  </div>

  <div class="hud" id="hud"></div>
  <div class="footer">Arrows move · 1–9 enter · 0 or Backspace clears · N toggles pencil</div>

<script>
"use strict";
/* ---------------- state ---------------- */
let board = [];            // current values, 0 = empty
let solution = [];         // correct full solution
let given = [];            // boolean[] — immutable givens
let drafts = {};           // idx -> Set of notes
let sel = { r: -1, c: -1 };
let history = [];          // undo stack
let noteMode = true;
let showErrors = true;
let difficulty = "medium";
const DIF_CUTS = { easy: 42, medium: 36, hard: 27 };

const $ = s => document.getElementById(s);
const gridEl = $("grid"), hudEl = $("hud"), numPadEl = $("numPad");

/* ---------------- sudoku engine ---------------- */
function rowUsed(o, r){ const s=new Set(); const a=r*9; for(let c=0;c<9;c++){const v=o[a+c]; if(v)s.add(v);} return s; }
function colUsed(o, c){ const s=new Set(); for(let r=0;r<9;r++){const v=o[r*9+c]; if(v)s.add(v);} return s; }
function boxUsed(o, r, c){ const s=new Set(); const br=Math.floor(r/3)*3, bc=Math.floor(c/3)*3;
  for(let i=0;i<3;i++)for(let j=0;j<3;j++){const v=o[(br+i)*9+bc+j]; if(v)s.add(v);} return s; }
function cands(o, r, c){
  const used=new Set([...rowUsed(o,r), ...colUsed(o,c), ...boxUsed(o,r,c)]);
  const out=[]; for(let n=1;n<=9;n++) if(!used.has(n)) out.push(n); return out;
}
function bestCell(o){
  let idx=-1, best=null, min=10;
  for(let i=0;i<81;i++){
    if(o[i]) continue;
    const c=cands(o, Math.floor(i/9), i%9);
    if(c.length<min){ min=c.length; idx=i; best=c; if(min===1) break; }
  }
  return [idx, best];
}
function solve(o){
  const [i,c]=bestCell(o);
  if(i===-1) return o.every(v=>v!==0) ? o.slice() : null;
  for(const v of c){ o[i]=v; const r=solve(o); if(r) return r; }
  o[i]=0; return null;
}
function generateSolved(){
  const o=new Array(81).fill(0);
  const bt=b=>{ const [i,c]=bestCell(b); if(i===-1) return true;
    for(let k=c.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); const t=c[k]; c[k]=c[j]; c[j]=t; }
    for(const v of c){ b[i]=v; if(bt(b)) return true; } b[i]=0; return false; };
  bt(o); return o;
}
function countSolutions(o){
  let n=0;
  const bt=b=>{ if(n>1) return;
    const [i,c]=bestCell(b); if(i===-1){ n++; return; }
    for(const v of c){ b[i]=v; bt(b); if(n>1) return; } b[i]=0; };
  bt(o); return n;
}
function carve(sol, target){
  const o=sol.slice();
  const order=[...Array(81).keys()];
  for(let k=80;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); const t=order[k]; order[k]=order[j]; order[j]=t; }
  let removed=0;
  for(const i of order){
    if(removed>=target || o[i]===0) continue;
    const back=o[i]; o[i]=0;
    if(countSolutions(o.slice())===1) removed++; else o[i]=back;
  }
  return o;
}

/* ---------------- game setup / render ---------------- */
function newGame(){
  solution = generateSolved();
  const puzzle = carve(solution.slice(), DIF_CUTS[difficulty]);
  board = puzzle.slice();
  given = board.map(v=>v!==0);
  drafts = {};
  history = [];
  sel = { r:-1, c:-1 };
  render();
  updateHud();
}

function render(){
  let out="<tbody>";
  for(let r=0;r<9;r++){
    out+="<tr>";
    for(let c=0;c<9;c++){
      const i=r*9+c;
      let cls="cell "+(given[i]?"given":"user");
      if(r!==8 && (r+1)%3===0) cls+=" bb";
      if(c!==8 && (c+1)%3===0) cls+=" br";
      if(sel.r===r && sel.c===c) cls+=" selected";
      else if(sel.r>=0 && (r===sel.r||c===sel.c)) cls+=" rowcol";
      else if(sel.r>=0 && board[sel.r*9+sel.c] && board[sel.r*9+sel.c]===board[i] && given[i]===false) cls+=" same";
      if(showErrors && !given[i] && board[i] && board[i]!==solution[i]) cls+=" error";
      if(given[i]) cls+=" locked";

      let content="";
      if(board[i]){ content=String(board[i]); }
      else if(drafts[i] && drafts[i].size){
        let p="";
        for(let n=1;n<=9;n++)
          p+=`<span style="color:${n%2?'#7dd3fc':'#fbbf24'}">${drafts[i].has(n)?n:""}</span>`;
        content=`<div class="pencil">${p}</div>`;
      }
      out+=`<td class="${cls}" data-i="${i}" data-r="${r}" data-c="${c}">${content}</td>`;
    }
    out+="</tr>";
  }
  out+="</tbody>";
  gridEl.innerHTML=out;
}

function updateHud(){
  let filled=0; for(let i=0;i<81;i++) if(board[i]) filled++;
  const target=given.reduce((a,v)=>a+(v?1:0),0);
  const done=filled-target;
  hudEl.textContent = isSolved(board)
    ? "🎉 Solved — perfect!"
    : `${done}/${81-target} filled · ${difficulty}`;
}
function isSolved(o){ for(let i=0;i<81;i++) if(!o[i]) return false; return true; }

function removeFromPeers(idx,v){
  const r=Math.floor(idx/9), c=idx%9;
  for(let k=0;k<9;k++){ if(idx!==r*9+k && drafts[r*9+k]) drafts[r*9+k].delete(v); }
  for(let k=0;k<9;k++){ if(idx!==k*9+c && drafts[k*9+c]) drafts[k*9+c].delete(v); }
  const br=(r/3)*3, bc=(c/3)*3;
  for(let i=0;i<3;i++)for(let j=0;j<3;j++){ const bi=(br+i)*9+bc+j; if(bi!==idx && drafts[bi]) drafts[bi].delete(v); }
}

/* ---------------- input ---------------- */
function selectCell(r,c){ sel={r,c}; render(); }

function enterValue(v){
  const i=sel.r*9+sel.c;
  if(sel.r<0 || given[i]) return;
  if(noteMode){
    if(!drafts[i]) drafts[i]=new Set();
    if(drafts[i].has(v)) drafts[i].delete(v); else drafts[i].add(v);
    render(); return;
  }
  // direct entry mode
  history.push({i, val:board[i], draft:drafts[i]?new Set(drafts[i]):null});
  board[i]=v; drafts[i]=null;
  removeFromPeers(i,v);
  render(); updateHud();
}

function clearCell(){
  const i=sel.r*9+sel.c;
  if(sel.r<0 || given[i]) return;
  history.push({i, val:board[i], draft:drafts[i]?new Set(drafts[i]):null});
  board[i]=0; drafts[i]=new Set();
  render(); updateHud();
}

function undo(){
  const h=history.pop();
  if(!h){ hudEl.textContent="Nothing to undo"; return; }
  board[h.i]=h.val;
  drafts[h.i]=h.draft?new Set(h.draft):new Set();
  render(); updateHud();
}

function hint(){
  if(sel.r<0){ hudEl.textContent="Select a cell first"; return; }
  const i=sel.r*9+sel.c;
  if(given[i] || board[i]===solution[i]){ hudEl.textContent="That cell is already correct"; return; }
  history.push({i, val:board[i], draft:drafts[i]?new Set(drafts[i]):null});
  board[i]=solution[i]; drafts[i]=null;
  removeFromPeers(i, solution[i]);
  render(); updateHud();
  hudEl.textContent="Hint applied ✔";
}

function check(){
  if(isSolved(board)){ hudEl.textContent="🎉 Solved — perfect!"; return; }
  let wrong=0; for(let i=0;i<81;i++) if(board[i] && board[i]!==solution[i]) wrong++;
  hudEl.textContent = wrong ? `${wrong} wrong value${wrong>1?"s":""} — keep going` : "All correct so far ✔";
  render();
}

function solveAll(){
  if(!window.confirm("Reveal the whole solution? Your progress will be overwritten.")) return;
  board=solution.slice();
  given=new Array(81).fill(true);
  drafts={}; history=[]; sel={r:-1,c:-1};
  render(); updateHud();
}

/* ---------------- wiring ---------------- */
gridEl.addEventListener("click", e=>{
  const td=e.target.closest("td");
  if(!td || !td.dataset) return;
  selectCell(+td.dataset.r, +td.dataset.c);
});

document.addEventListener("keydown", e=>{
  if(sel.r<0) return;
  const k=e.key;
  if(k>="1"&&k<="9"){ enterValue(+k); e.preventDefault(); }
  else if(k==="0"||k==="Backspace"||k==="Delete"){ clearCell(); e.preventDefault(); }
  else if(k==="ArrowUp"){ selectCell(Math.max(0,sel.r-1),sel.c); e.preventDefault(); }
  else if(k==="ArrowDown"){ selectCell(Math.min(8,sel.r+1),sel.c); e.preventDefault(); }
  else if(k==="ArrowLeft"){ selectCell(sel.r,Math.max(0,sel.c-1)); e.preventDefault(); }
  else if(k==="ArrowRight"){ selectCell(sel.r,Math.min(8,sel.c+1)); e.preventDefault(); }
  else if(k==="n"||k==="N"){ noteMode=!noteMode; $("noteMode").checked=noteMode; }
});

// number pad
for(let n=1;n<=9;n++){
  const b=document.createElement("button");
  b.textContent=n;
  b.onclick=()=>{ if(sel.r<0){ hudEl.textContent="Select a cell first"; return; } enterValue(n); };
  numPadEl.appendChild(b);
}
$("noteMode").onchange = e => noteMode=e.target.checked;
$("errCheck").onchange = e => { showErrors=e.target.checked; render(); };
$("diff").onchange = e => difficulty=e.target.value;
$("newBtn").onclick = newGame;
$("hintBtn").onclick = hint;
$("undoBtn").onclick = undo;
$("clearBtn").onclick = clearCell;
$("checkBtn").onclick = check;
$("solveBtn").onclick = solveAll;

newGame();
</script>
</body>
</html>
